# ===========================================================================
# Jalachakra - crop water balance assumptions
# ===========================================================================
# Every judgement call in the baseline lives here rather than in code, so a
# reviewer can see what was assumed, change it, and re-run. Nothing in
# ml/baseline.py contains a hard-coded coefficient.
#
# Each block records WHAT the value is, WHERE it comes from, and HOW confident
# the project is in it. Values marked `indicative` are published typical ranges,
# not measurements at this site, and any result that depends on them carries
# that caveat.
# ===========================================================================

# ---------------------------------------------------------------------------
# Effective rainfall
# ---------------------------------------------------------------------------
# "Effective" rainfall is the part of a rainfall event that actually reaches the
# root zone and is available to the crop. The rest is intercepted by the canopy
# and evaporated, runs off, or drains below the roots.
#
# IMPORTANT METHOD NOTE. The widely quoted USDA Soil Conservation Service
# formula is defined on MONTHLY rainfall totals. Applying it to a daily value
# is a unit error: it treats a 10 mm day as though it were a 10 mm month and
# returns an effective fraction near 0.98, which credits almost all light rain
# to the crop. Light daily rain is largely intercepted and evaporated, so the
# daily answer should be far lower. This project therefore runs a daily method
# by default and offers the SCS formula only on monthly aggregates, where it is
# valid. See docs/irrigation_decision_logic.md.
effective_rainfall:
  method: daily_threshold_fraction

  daily_threshold_fraction:
    # Rain below this depth is treated as fully lost: it wets the canopy and
    # the top few millimetres of soil and evaporates without reaching the roots.
    interception_threshold_mm: 2.0
    # Fraction of the rain above the threshold that infiltrates and is retained
    # in the root zone. The remainder is runoff and deep percolation.
    infiltration_fraction: 0.75
    # A single day cannot usefully store more than the root zone can hold.
    # Rain beyond this drains away. Overridden per crop when rooting depth and
    # soil water-holding capacity are both known.
    default_max_daily_storage_mm: 40.0
    basis: >
      Indicative values chosen to behave sensibly at the daily time step: light
      showers contribute nothing, moderate rain contributes most of its depth,
      and a single storm cannot recharge more than the root zone holds. These
      are modelling assumptions, not locally calibrated constants, and the
      sensitivity of the irrigation advice to them is reported.

  fixed_fraction:
    fraction: 0.80
    basis: The simplest possible assumption, retained as a comparison baseline.

  usda_scs_monthly:
    basis: >
      USDA SCS: Pe = P * (125 - 0.2 * P) / 125 for P < 250 mm, otherwise
      Pe = 125 + 0.1 * P, with P a MONTHLY total in mm. Valid only on monthly
      aggregates. ml/effective_rainfall.py refuses to apply it to a daily
      series unless explicitly forced.

# ---------------------------------------------------------------------------
# Irrigation application efficiency
# ---------------------------------------------------------------------------
# Fraction of water delivered to the field that ends up stored in the root zone.
# Gross requirement = net requirement / efficiency, so a low-efficiency method
# needs MORE water delivered to satisfy the same crop demand.
irrigation_efficiency:
  default: 0.65
  by_method:
    drip: 0.90
    sprinkler: 0.75
    furrow: 0.65
    flood: 0.55
    basin: 0.55
    surface: 0.55
  basis: >
    Indicative published application efficiencies for well-managed systems.
    They are not measurements at any field in this study, and actual on-farm
    efficiency varies widely with maintenance, levelling and scheduling. They
    are configurable here precisely because a farmer's real system may differ,
    and the API accepts a per-field override.
  confidence: indicative

# ---------------------------------------------------------------------------
# Soil water contribution
# ---------------------------------------------------------------------------
# Water the root zone can supply from storage before irrigation is needed.
# WITHOUT SOIL MOISTURE SENSORS THIS IS AN ESTIMATE, NEVER A MEASUREMENT.
# Every output derived from it is labelled as estimated, including in the app.
soil_water:
  # Total available water held per metre of soil depth, by texture.
  available_water_mm_per_m:
    sand: 70.0
    loamy_sand: 90.0
    sandy_loam: 120.0
    loam: 160.0
    silt_loam: 180.0
    clay_loam: 170.0
    silty_clay: 160.0
    clay: 150.0
    peaty: 200.0
    default: 150.0
  # Fraction of available water a crop can extract before it suffers stress.
  # FAO-56 calls this the depletion fraction p.
  depletion_fraction_p: 0.50
  basis: >
    Indicative texture-based available water capacities and a mid-range
    depletion fraction. The project's own crop calendar states a water-holding
    capacity of 125 mm/m for its five crops, which sits inside this range and is
    used in preference when the crop is present in that file.
  confidence: indicative

# ---------------------------------------------------------------------------
# Root-zone water balance
# ---------------------------------------------------------------------------
# A running estimate of root-zone depletion, in the absence of any sensor.
root_zone_balance:
  enabled: true
  # Depletion at the start of a simulated cycle, as a fraction of total
  # available water. Zero means the profile starts at field capacity.
  initial_depletion_fraction: 0.0
  labelling: >
    Root-zone status produced by this balance is ESTIMATED, not measured. It is
    the accumulated result of modelled crop demand, observed rainfall and
    recorded irrigation. Any interface showing it must say so.

# ---------------------------------------------------------------------------
# Crop cohort design
# ---------------------------------------------------------------------------
# The weather series is real and continuous, but nothing in the data records
# when anything was actually sown. To obtain crop-day records the study sweeps
# simulated sowing dates across the whole weather record. Each resulting row
# pairs a REAL weather day with a crop age implied by the simulated sowing date.
#
# This is a designed sweep, not observed planting, and it is labelled that way
# wherever it appears. Its purpose is to expose every combination of growth
# stage and season, which is what makes growth-stage effects identifiable.
cohort_design:
  sowing_interval_days: 15
  drop_incomplete_cycles: true
  basis: >
    A 15-day interval spans every part of the seasonal cycle several times over
    seven years while keeping the panel small enough to train on a laptop.
    Cycles that would run past the end of the weather record are dropped rather
    than truncated, so every cohort is a complete crop cycle.

# ---------------------------------------------------------------------------
# Unit conversion
# ---------------------------------------------------------------------------
units:
  litres_per_mm_per_hectare: 10000.0
  basis: >
    Exact by definition: 1 mm over 1 ha is 0.001 m x 10,000 m2 = 10 m3 =
    10,000 L. Depth and volume are kept in separate columns throughout, and
    volume is only ever computed once an area is supplied.
