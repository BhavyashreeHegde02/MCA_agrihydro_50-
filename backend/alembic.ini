# Alembic configuration.
#
#     alembic -c backend/alembic.ini upgrade head
#     alembic -c backend/alembic.ini downgrade -1
#     alembic -c backend/alembic.ini revision --autogenerate -m "what changed"
#
# The database URL is deliberately absent from this file. env.py reads it from
# the application's own settings, so a migration can never run against a
# different database than the service does, and no connection string is
# committed. Set DATABASE_URL in the environment to point it somewhere.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s/..:%(here)s

# Timestamped filenames, so the order of revisions is readable on disk rather
# than only in the chain of down_revisions.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Migrations describe schema, not time zones; UTC keeps filenames stable
# wherever they are generated.
timezone = UTC

[post_write_hooks]
# None. Formatting a generated migration would rewrite it after review.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
